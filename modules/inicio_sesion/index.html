<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIGEP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sena-green': '#39A900',
                        'sena-blue': '#00324D',
                        'sena-yellow': '#FFC000',
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 font-sans min-h-screen text-slate-900">
    
    <main class="grid min-h-screen lg:grid-cols-[1.1fr_0.9fr]">

        
        <section class="relative hidden overflow-hidden lg:block">
            
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(16,185,129,0.22),transparent_30%),radial-gradient(circle_at_80%_30%,rgba(250,204,21,0.16),transparent_26%),linear-gradient(180deg,#020617_0%,#0f172a_100%)]"></div>

            <div class="relative flex h-full flex-col items-center justify-center p-10 text-white text-center gap-16">
                
                <div class="flex items-center gap-3">
                    <img src="../../assets/img/icons/logo-sena.png" alt="Logo SENA" class="h-10 w-auto brightness-0 invert" />
                    <p class="text-2xl font-black tracking-tight text-white">
                        Porci<span class="text-emerald-400 font-black">Tech</span>
                    </p>
                </div>
                
                <div class="max-w-xl">
                    <p class="text-sm font-semibold uppercase tracking-[0.25em] text-emerald-300">
                        Acceso seguro
                    </p>
                    <h1 class="mt-4 text-5xl font-black tracking-tight">
                        Bienvenido al Sistema Integral de Gestión Porcina
                    </h1>
                </div>
            </div>
        </section>

        
        <section class="flex items-center justify-center px-6 py-14 bg-slate-50 lg:bg-transparent">
            
            <div class="w-full max-w-md rounded-[2rem] border border-slate-200 lg:border-slate-800 bg-white p-8 shadow-2xl shadow-slate-950/10 lg:shadow-slate-950/30 sm:p-10">
                <div class="mb-8 flex items-start justify-between">
                    <div>
                        <p class="text-sm font-semibold uppercase tracking-[0.22em] text-emerald-700">
                            Iniciar sesión
                        </p>
                        <h2 class="mt-3 text-3xl font-black tracking-tight text-slate-950">
                            Ingresa a tu cuenta
                        </h2>
                    </div>
                    
                    <div class="lg:hidden flex items-center">
                        <img src="../../assets/img/icons/logo-sena.png" alt="Logo SENA" class="h-8 w-auto" />
                    </div>
                </div>

                <form id="loginForm" class="space-y-5">
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-slate-700">Usuario</label>
                        <input type="email" id="email" value="operador@porcitech.co" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none bg-slate-50 text-slate-800 font-medium">
                    </div>

                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-slate-700">Contraseña</label>
                        <input type="password" id="password" value="Sena2026*" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none bg-slate-50 text-slate-800 font-medium">
                    </div>

                    <div class="flex items-center justify-between gap-4 text-sm">
                        <a href="../contraseña-olvidada/index.html" class="font-medium text-emerald-700 transition hover:text-emerald-800">
                            ¿Olvidaste tu contraseña?
                        </a>
                        <span class="rounded-full bg-slate-100 px-3 py-1 font-medium text-slate-500">
                            Demo
                        </span>
                    </div>

                    <button type="submit" class="w-full py-2.5 font-black bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-md shadow-emerald-600/30 transition border-none mt-4">
                        Ingresar al dashboard
                    </button>
                </form>

                <div class="mt-8 border-t border-slate-200 pt-6 text-sm text-slate-600">
                    <p>Vista basada en el módulo de inicio de sesión del repositorio original.</p>
                    <a href="../../index.html" class="mt-3 inline-flex font-semibold text-emerald-700 hover:text-emerald-800">
                        Volver a la landing
                    </a>
                </div>
            </div>

        </section>

    </main>

    
    <script src="script.js"></script>
</body>
</html>
